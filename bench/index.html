<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orin Power Live</title>
<style>
  :root{--bg:#f6f8fa;--panel:#fff;--line:#d0d7de;--fg:#1f2328;--dim:#656d76;
        --vin:#0969da;--cgc:#cf222e;--soc:#8250df;--idle:#1a7f37;--warn:#9a6700;--btn:#f3f4f6}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0e1116;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;
          --vin:#58a6ff;--cgc:#ff7b72;--soc:#bc8cff;--idle:#3fb950;--warn:#d29922;--btn:#21262d}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;
         gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0 8px 0 0;font-weight:600}
  .mode{color:var(--dim);font-size:12px}
  label{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center}
  select,input{background:var(--panel);color:var(--fg);border:1px solid var(--line);
               border-radius:6px;padding:6px 8px;font:inherit;font-size:13px}
  input[type=number]{width:80px}
  button{background:var(--btn);color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  button.primary{background:var(--vin);border-color:var(--vin);color:#fff}
  main{padding:16px;display:grid;gap:16px;max-width:1400px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .tile .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .tile .v{font-size:21px;margin-top:2px;font-variant-numeric:tabular-nums}
  .tile .u{color:var(--dim);font-size:12px;margin-left:3px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
  canvas{width:100%;height:320px;display:block}
  .legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
  .status{font-size:12px;color:var(--warn)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .row h2{font-size:13px;margin:0;font-weight:600;flex:1}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:500}
  .empty{color:var(--dim);font-size:12px;padding:6px 0}
  @media (max-width:560px){canvas{height:220px}header{gap:10px}}
</style>
</head>
<body>
<header>
  <h1>Orin Nano: inference power</h1>
  <label>framework <select id="fw"></select></label>
  <label>precision <select id="prec"></select></label>
  <label>fps cap <input id="fps" type="number" min="0" max="1000" value="30" title="0 = run as fast as possible"></label>
  <button id="apply" class="primary">run</button>
  <button id="stop">idle</button>
  <span class="mode" id="mode"></span>
  <span id="status" class="status"></span>
</header>
<main>
  <div class="tiles">
    <div class="tile"><div class="k">running</div><div class="v" id="running" style="font-size:14px;margin-top:6px">idle</div></div>
    <div class="tile"><div class="k">board now</div><div class="v"><span id="now">--</span><span class="u">W</span></div></div>
    <div class="tile"><div class="k">board 5 s mean</div><div class="v"><span id="mean">--</span><span class="u">W</span></div></div>
    <div class="tile"><div class="k">CPU+GPU+CV rail</div><div class="v"><span id="rail">--</span><span class="u">W</span></div></div>
    <div class="tile"><div class="k">idle floor</div><div class="v"><span id="idle">--</span><span class="u">W</span></div></div>
    <div class="tile"><div class="k">achieved</div><div class="v"><span id="afps">--</span><span class="u">fps</span></div></div>
    <div class="tile"><div class="k">frame time</div><div class="v"><span id="ms">--</span><span class="u">ms</span></div></div>
    <div class="tile"><div class="k">duty cycle</div><div class="v"><span id="duty">--</span><span class="u">%</span></div></div>
    <div class="tile"><div class="k">GPU clock</div><div class="v"><span id="mhz">--</span><span class="u">MHz</span></div></div>
    <div class="tile"><div class="k">energy</div><div class="v"><span id="jf">--</span><span class="u">mJ/frame</span></div></div>
    <div class="tile"><div class="k">energy above idle</div><div class="v"><span id="jfm">--</span><span class="u">mJ/frame</span></div></div>
  </div>
  <div id="caveat" class="status"></div>
  <div class="panel">
    <canvas id="c"></canvas>
    <div class="legend">
      <span><i class="sw" style="background:var(--vin)"></i>VDD_IN (whole board)</span>
      <span><i class="sw" style="background:var(--cgc)"></i>VDD_CPU_GPU_CV</span>
      <span><i class="sw" style="background:var(--soc)"></i>VDD_SOC</span>
      <span><i class="sw" style="background:var(--idle)"></i>idle floor</span>
      <span id="span"></span>
    </div>
  </div>
  <div class="panel">
    <div class="row">
      <h2>Saved readings</h2>
      <button id="snap">save current reading</button>
      <button id="copy">copy CSV</button>
      <button id="clear">clear</button>
    </div>
    <div class="tablewrap"><table id="snaps"></table></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let engines = [], series = [], idleW = null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? "--" : Number(v).toFixed(d);

async function loadEngines() {
  const d = await (await fetch("/api/engines")).json();
  engines = d.engines;
  $("fw").innerHTML = d.frameworks.map(f => `<option value="${f}">${f}</option>`).join("");
  fillPrecisions();
}

function fillPrecisions(keep) {
  const fw = $("fw").value;
  $("prec").innerHTML = engines.filter(e => e.framework === fw).map(e =>
    `<option value="${e.id}" ${e.available ? "" : "disabled"}>${e.precision}${e.caveat ? " *" : ""}${e.available ? "" : " (not built)"}</option>`).join("");
  if (keep) $("prec").value = keep;
  if ($("prec").selectedOptions[0]?.disabled) {
    const ok = [...$("prec").options].find(o => !o.disabled);
    if (ok) $("prec").value = ok.value;
  }
}
$("fw").onchange = () => fillPrecisions();

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
                               body: JSON.stringify(body || {})});
  return r.json().catch(() => ({}));
}

$("apply").onclick = () => { $("status").textContent = "switching…";
  post("/api/select", {engine: $("prec").value, fps: Number($("fps").value)}); };
$("stop").onclick = () => post("/api/select", {engine: "idle", fps: 0});
$("snap").onclick = async () => { const r = await post("/api/snapshot");
  if (!r.ok) $("status").textContent = r.error || "could not save"; };
$("clear").onclick = () => post("/api/snapshot/clear");

let snaps = [];
const COLS = [["label", "engine", null], ["fps_cap", "cap", 0], ["fps", "fps", 1], ["ms", "ms", 2],
              ["mean_w", "board W", 2], ["rail_w", "compute W", 2], ["gpu_mhz", "GPU MHz", 0],
              ["j_per_frame", "mJ/frame", 1, 1000], ["j_per_frame_marginal", "mJ above idle", 1, 1000]];
function renderSnaps() {
  if (!snaps.length) { $("snaps").innerHTML = `<tr><td class="empty">Run an engine, let it settle, then save a reading to compare engines side by side.</td></tr>`; return; }
  $("snaps").innerHTML = "<tr>" + COLS.map(c => `<th>${c[1]}</th>`).join("") + "</tr>" +
    snaps.map(s => "<tr>" + COLS.map(([k, , d, m]) => {
      const v = s[k];
      if (d === null) return `<td>${v}</td>`;
      if (k === "fps_cap") return `<td>${v || "max"}</td>`;
      return `<td>${fmt(v == null ? v : v * (m || 1), d)}</td>`;
    }).join("") + "</tr>").join("");
}
$("copy").onclick = () => {
  const lines = [COLS.map(c => c[1]).join(",")].concat(snaps.map(s => COLS.map(([k, , , m]) =>
    typeof s[k] === "number" ? s[k] * (m || 1) : s[k]).join(",")));
  navigator.clipboard.writeText(lines.join("\n")).then(() => $("status").textContent = "copied");
};

async function poll() {
  try {
    const d = await (await fetch("/api/state", {cache: "no-store"})).json();
    const s = d.state;
    series = d.series || []; idleW = s.idle_w ?? null;
    const eng = engines.find(e => e.id === s.engine);
    $("running").textContent = eng ? `${eng.label} @ ${s.fps_cap || "max"} fps` : "idle";
    $("caveat").textContent = eng && eng.caveat ? `* ${eng.caveat}` : "";
    $("mode").textContent = `power mode ${s.power_mode}`;
    $("now").textContent = fmt(s.now_w); $("mean").textContent = fmt(s.mean_w);
    $("rail").textContent = fmt(s.rail_w); $("idle").textContent = fmt(s.idle_w);
    $("afps").textContent = fmt(s.fps, 1); $("ms").textContent = fmt(s.ms, 2);
    $("duty").textContent = s.duty != null ? fmt(s.duty * 100, 1) : "--";
    $("mhz").textContent = fmt(s.gpu_mhz, 0);
    $("jf").textContent = s.j_per_frame != null ? fmt(s.j_per_frame * 1000, 1) : "--";
    $("jfm").textContent = s.j_per_frame_marginal != null ? fmt(s.j_per_frame_marginal * 1000, 1) : "--";
    $("status").textContent = s.error || (s.switching ? "switching…" : s.warming ? "warming up…" :
      (s.engine === "idle" && s.idle_w == null ? "measuring idle floor…" : ""));
    if (JSON.stringify(d.snapshots) !== JSON.stringify(snaps)) { snaps = d.snapshots; renderSnaps(); }
    draw();
  } catch (e) {
    $("status").textContent = "lost connection to the Orin";
  }
}

function draw() {
  const c = $("c"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const x = c.getContext("2d");
  x.scale(dpr, dpr); x.clearRect(0, 0, w, h);
  if (series.length < 2) return;
  const pad = {l: 40, r: 10, t: 10, b: 22};
  const t0 = series[0][0], t1 = series[series.length - 1][0], span = Math.max(1e-6, t1 - t0);
  let max = 0; for (const p of series) max = Math.max(max, p[1]);
  max = Math.max(2, Math.ceil(max * 1.15));
  $("span").textContent = `last ${Math.round(span)} s`;
  const px = t => pad.l + (t - t0) / span * (w - pad.l - pad.r);
  const py = v => h - pad.b - (v / max) * (h - pad.t - pad.b);
  x.strokeStyle = css("--line"); x.fillStyle = css("--dim"); x.lineWidth = 1; x.font = "11px ui-monospace";
  for (let i = 0; i <= 5; i++) {
    const v = max * i / 5, y = py(v);
    x.beginPath(); x.moveTo(pad.l, y); x.lineTo(w - pad.r, y); x.stroke();
    x.fillText(v.toFixed(0) + "W", 4, y + 3);
  }
  for (let s = Math.ceil(t0 / 10) * 10; s <= t1; s += 10) x.fillText(`${s}s`, px(s) - 10, h - 6);
  if (idleW) {
    x.strokeStyle = css("--idle"); x.setLineDash([5, 4]);
    x.beginPath(); x.moveTo(pad.l, py(idleW)); x.lineTo(w - pad.r, py(idleW)); x.stroke();
    x.setLineDash([]);
  }
  for (const [idx, col] of [[3, "--soc"], [2, "--cgc"], [1, "--vin"]]) {
    x.strokeStyle = css(col); x.lineWidth = 1.6; x.beginPath();
    series.forEach((p, i) => i ? x.lineTo(px(p[0]), py(p[idx])) : x.moveTo(px(p[0]), py(p[idx])));
    x.stroke();
  }
}

window.addEventListener("resize", draw);
loadEngines().then(() => { renderSnaps(); poll(); setInterval(poll, 500); });
</script>
</body>
</html>
